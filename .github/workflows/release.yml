name: Release

# Publishes a signed Windows build whenever you push a version tag, e.g.:
#   git tag v0.1.2 && git push origin v0.1.2
# The job builds the app, signs the updater artifact and creates a GitHub Release
# containing the installer + latest.json that the in-app updater reads.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Time Tracker ${{ github.ref_name }}"
          releaseBody: "Automatic update release. Download the setup .exe below to install manually, or let the app update itself."
          releaseDraft: false
          prerelease: false
